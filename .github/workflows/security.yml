name: Security and image checks
on:
  workflow_call:
  push:
  pull_request:
  schedule:
    - cron: '31 8 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - run: pip install --no-index --find-links vendor/python/linux-amd64 --require-hashes -r requirements.lock
      - run: pip install --no-index --find-links vendor/python/linux-amd64 --no-deps --require-hashes -r requirements-test.lock
      - run: pip install pip-audit pip-licenses
      - run: pip-audit -r requirements.lock
      - run: npm ci --offline --cache ../vendor/npm && npm audit && npm run build
        working-directory: frontend
      - run: pip-licenses --format=json --with-urls --with-license-file --no-license-path > python-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: python-licenses.json
      - run: docker build --platform linux/amd64 --network=none -t fgt-upgrade-review:ci .
      - run: docker run --rm --network none -v "$PWD/scripts/audit_pdf_dependencies.py:/audit.py:ro" fgt-upgrade-review:ci python /audit.py
      - run: docker run --rm --cap-drop ALL --security-opt no-new-privileges fgt-upgrade-review:ci python -m backend.sandbox_check
      - name: Record complete image vulnerability inventory
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fgt-upgrade-review:ci
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-inventory.json
      - name: Retain image vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulnerability-inventory
          path: trivy-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Block fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fgt-upgrade-review:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
