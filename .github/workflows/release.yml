name: Build private edition bundle
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --no-index --find-links vendor/python/linux-amd64 --require-hashes -r requirements.lock
      - run: pip install --no-index --find-links vendor/python/linux-amd64 --no-deps --require-hashes -r requirements-test.lock
      - run: python -m pytest tests/test_security.py tests/test_api_client.py tests/test_reviews.py tests/test_team.py tests/test_administration.py tests/test_api_coverage.py tests/test_usability.py tests/test_maintenance.py tests/test_content_parity.py tests/test_pdf_parser_units.py tests/test_pdf_section_boundaries.py tests/test_pdf_issue_markdown.py tests/test_pdf_callouts.py tests/test_pdf_heading_levels.py tests/test_pdf_prose_format.py tests/test_pdf_table_format.py tests/test_pdf_table_lists.py tests/test_pdf_table_continuations.py tests/test_range_notices.py tests/test_pdf_engine_security.py tests/test_pdf_worker.py tests/test_performance_paths.py tests/test_fgt_utils.py tests/test_scraper_html.py tests/test_release_packaging.py -q
      - run: npm ci --offline --cache ../vendor/npm && npm run test:content && npm run build
        working-directory: frontend
      - run: python -m pytest tests/test_presentation_api.py -q
      - run: python scripts/package_releases.py --output dist/releases
      - run: |
          mkdir -p dist/install-check
          tar -xzf dist/releases/fgt-upgrade-review-3.0.0-private.tar.gz -C dist/install-check
          docker build --build-arg BUILD_NUMBER="ci-${{ github.run_number }}.${{ github.run_attempt }}" --build-arg BUILD_REVISION="${{ github.sha }}" -t fgt-upgrade-review-private:3.0.0 dist/install-check/fgt-upgrade-review-3.0.0-private
      - run: python scripts/package_releases.py --output dist/releases --docker-image fgt-upgrade-review-private:3.0.0
      - run: sha256sum -c SHA256SUMS
        working-directory: dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: private-edition
          path: dist/releases/*
