name: Build public edition bundle
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    uses: ./.github/workflows/regression.yml
  security:
    uses: ./.github/workflows/security.yml
  bundles:
    needs: [regression, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --no-index --find-links vendor/python/linux-amd64 --require-hashes -r requirements.lock
      - run: python -m pip install --no-index --find-links vendor/python/linux-amd64 --no-deps --require-hashes -r requirements-test.lock
      - run: npm ci --offline --cache ../vendor/npm && npm run build
        working-directory: frontend
      - run: python -m pytest tests/test_release_packaging.py -q
      - name: Package the verified source
        id: package
        run: |
          python scripts/package_releases.py --output dist/releases
          python -c 'import os; from scripts.package_releases import VERSION; open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + VERSION + "\n")'
      - name: Build the edition image from the packaged source
        env:
          VERSION: ${{ steps.package.outputs.version }}
          BUILD_NUMBER: ci-${{ github.run_number }}.${{ github.run_attempt }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          mkdir -p dist/install-check
          tar -xzf "dist/releases/fgt-upgrade-review-${VERSION}-public.tar.gz" -C dist/install-check
          docker build --platform linux/amd64 --network=none --build-arg "BUILD_NUMBER=${BUILD_NUMBER}" --build-arg "BUILD_REVISION=${BUILD_REVISION}" -t "fgt-upgrade-review-public:${VERSION}" "dist/install-check/fgt-upgrade-review-${VERSION}-public"
          python scripts/package_releases.py --output dist/releases --docker-image "fgt-upgrade-review-public:${VERSION}"
      - run: sha256sum -c SHA256SUMS
        working-directory: dist/releases
      - uses: actions/upload-artifact@v4
        with:
          name: public-edition
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
