name: Feature regression suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - run: python -m pip install --no-index --find-links vendor/python/linux-amd64 --require-hashes -r requirements.lock
      - run: python -m pip install --no-index --find-links vendor/python/linux-amd64 --no-deps --require-hashes -r requirements-test.lock
      - run: npm ci --offline --cache ../vendor/npm
        working-directory: frontend
      - run: node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: python scripts/check.py
      - name: Preserve diagnostics even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
